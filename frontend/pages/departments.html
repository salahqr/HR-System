<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments | PresenceHR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <link rel="stylesheet" href="../css/departments.css">
    <script src="../js/departments.js" defer></script>
</head>
<body>

    <main class="page">

        <section class="page-heading">
            <div>
                <span class="eyebrow">ORGANIZATION</span>

                <div class="title-row">
                    <h1>Departments</h1>
                    <span class="count-badge" id="department-count">0 departments</span>
                </div>

                <p class="subtitle">
                    Manage teams, department heads, and department status.
                </p>
            </div>

            <button class="button button-primary" id="add-department-button" type="button">
                <span class="material-symbols-outlined">add</span>
                Add department
            </button>
        </section>

        <section class="toolbar">
            <label class="search-field">
                <span class="material-symbols-outlined">search</span>
                <input
                    id="search-input"
                    type="search"
                    placeholder="Search departments or heads..."
                    autocomplete="off"
                >
            </label>

            <select id="status-filter" aria-label="Filter by status">
                <option value="all">All statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </section>

        <section class="table-card">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Department name</th>
                            <th>Department head</th>
                            <th>Employees</th>
                            <th>Status</th>
                            <th class="actions-heading">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="departments-table-body"></tbody>
                </table>

                <div class="empty-state hidden" id="empty-state">
                    <span class="material-symbols-outlined">corporate_fare</span>
                    <h2>No departments found</h2>
                    <p>Try changing your search or add a department.</p>
                </div>
            </div>

            <div class="table-footer">
                <span id="results-label">Showing 0 departments</span>
                <button class="text-button" id="reset-demo-data" type="button">
                    Reset demo data
                </button>
            </div>
        </section>

    </main>

    <!-- Add / Update Department Dialog -->
    <dialog id="department-dialog" class="department-dialog">
        <form id="department-form">

            <div class="dialog-heading">
                <div>
                    <span class="eyebrow">DEPARTMENT DETAILS</span>
                    <h2 id="dialog-title">Add department</h2>
                </div>

                <button
                    class="icon-button"
                    id="close-dialog-button"
                    type="button"
                    aria-label="Close dialog"
                >
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <input type="hidden" id="department-id">

            <label class="form-field">
                <span>Department name *</span>
                <input id="department-name" maxlength="80" required>
            </label>

            <label class="form-field">
                <span>Department head</span>
                <input id="department-head" maxlength="80" placeholder="Optional">
            </label>

            <label class="form-field">
                <span>Number of employees *</span>
                <input
                    id="employee-count"
                    type="number"
                    min="0"
                    max="100000"
                    value="0"
                    required
                >
            </label>

            <label class="form-field">
                <span>Status</span>
                <select id="department-status">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </label>

            <p id="form-error" class="form-error hidden" role="alert"></p>

            <div class="dialog-actions">
                <button class="button button-secondary" id="cancel-dialog-button" type="button">
                    Cancel
                </button>

                <button class="button button-primary" id="save-department-button" type="submit">
                    Save department
                </button>
            </div>

        </form>
    </dialog>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
